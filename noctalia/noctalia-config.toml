[bar]
order = [ "left", "default" ]

    [bar.default]
    center = [ "active_window" ]
    enabled = true
    end = [ "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session" ]
    margin_ends = 0
    radius_top_left = 0
    radius_top_right = 0
    scale = 1.2500000111758709
    shadow = false
    start = [ "workspaces" ]

    [bar.left]
    auto_hide = true
    center = [ "media" ]
    enabled = true
    end = [ "screenshot", "cpu", "ram" ]
    margin_ends = 0
    position = "left"
    radius_bottom_left = 0
    radius_top_left = 0
    reserve_space = false
    scale = 1.2500000111758709
    show_on_workspace_switch = false
    start = [ "wallpaper" ]

        [bar.left.dead_zone.actions]
        right = "none"

[dock]
auto_hide = true
enabled = true
icon_size = 36
launcher_position = "start"
reserve_space = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 807.00006103515625
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
lang = "pt-BR"

    [shell.launcher]
    app_grid = true
    fetch_exchange_rates = false
    pinned = [ "kitty", "vivaldi-stable", "code-oss" ]
    show_app_origin_indicator = false

        [shell.launcher.providers.calculator]
        prefix = "="

    [shell.panel]
    open_near_click_clipboard = true
    transparency_mode = "glass"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Dracula"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "hyprland", "kitty" ]

[wallpaper]
directory = "/home/andre/Pictures/wallpapers"
transition = [ "fade", "zoom" ]
transition_on_startup = true

    [wallpaper.automation]
    interval_seconds = 3600

    [wallpaper.default]
    path = "/home/andre/Pictures/wallpapers/11.jpeg"

    [wallpaper.last]
    path = "/home/andre/Pictures/wallpapers/11.jpeg"

    [wallpaper.monitors.eDP-1]
    path = "/home/andre/Pictures/wallpapers/11.jpeg"

[widget.cpu]
label_show_units = false
show_value = false

[widget.ram]
show_value = false
